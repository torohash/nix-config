# Home Manager管理の読み取り専用ファイルへ初回設定を書き込ませない。
onboarding = false

[keys]
# 左手だけで操作する。prefixはPi・Claude Code・bash・Hyprlandと衝突しないalt+s。
prefix = "alt+s"

# workspaceはWASDと同じ並びでA=前、D=次に移動する。
previous_workspace = "prefix+a"
next_workspace = "prefix+d"

# agentはShift付きの同じ並びで移動する。
previous_agent = "prefix+shift+a"
next_agent = "prefix+shift+d"

# 新しいworkspaceは、新しいtab(prefix+c)にShiftを足したprefix+shift+cにする(既定のprefix+shift+nは左手から遠い)。
new_workspace = "prefix+shift+c"

# 既定のprefix+shift+d(workspaceを閉じる)はagent移動に使うため、prefix+shift+qへ移す。
close_workspace = "prefix+shift+q"
